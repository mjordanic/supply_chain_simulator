[project]
name = "retail-market-sim"
version = "0.1.0"
description = "Retail market simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.43.0",
    "pandas>=2.2.2",
    "transformers>=4.44.2",
    "torch>=2.4.0",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "accelerate>=0.34.0",
    "groq>=0.11.0",
    "numpy>=2.1.1",
    "statsmodels>=0.14.4",
    "anthropic>=0.37.1",
    "pyarrow>=17.0.0",
    "joblib>=1.4.2",
    "httpx==0.27.2",
    "dill>=0.3.9",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "plotly>=6.7.0",
    "nbformat>=5.10.4",
    "ipympl>=0.10.0",
    "gymnasium>=0.29",
    "tensorboard>=2.20.0",
    "optuna>=4.8.0",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "nbconvert>=7.17.1",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit the real OpenAI API (skipped when OPENAI_API_KEY is unset)",
    "slow: tests that run a full training loop and take >10s (excluded from default fast run)",
]
